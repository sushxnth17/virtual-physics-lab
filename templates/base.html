<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}Virtual Physics Lab{% endblock %}</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/glassmorphism.css') }}">
</head>
<body>
	<header class="site-header">
		<div class="container header-top">
			<div class="logo-placeholder" aria-label="VTU logo placeholder">VTU LOGO</div>
			<div class="portal-title-wrap">
				<p class="portal-subtitle">VTU Curriculum | CMRIT Physics Laboratory</p>
				<h1 class="portal-title">Virtual Physics Lab Portal</h1>
			</div>
			<div class="logo-placeholder" aria-label="CMRIT logo placeholder">CMRIT LOGO</div>
		</div>
		<nav class="portal-nav" aria-label="Primary navigation">
			<div class="container">
				<ul class="nav-links">
					<li><a href="/">Home</a></li>
					<li><a href="/experiments">Experiments</a></li>
				</ul>
			</div>
		</nav>
	</header>

	<main class="main-content container">
		{% block content %}{% endblock %}
	</main>

	<footer class="site-footer">
		<div class="container">
			<p>Virtual Physics Lab | Engineering Physics Experiments</p>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script>
		window.MathJax = {
			tex: {
				inlineMath: [['\\(', '\\)'], ['$', '$']],
				displayMath: [['\\[', '\\]'], ['$$', '$$']]
			},
			options: {
				skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
			}
		};
	</script>
	<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
	{% block scripts %}{% endblock %}
</body>
</html>
