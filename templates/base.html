<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}CircuitSphere – Virtual Physics Lab{% endblock %}</title>
	<meta name="description" content="CircuitSphere Virtual Physics Lab – Execute precision experiments in electromagnetic theory and component characterization.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/glassmorphism.css') }}">
</head>
<body>
	<header class="site-header">
		<div class="container header-top">
			<div class="logo-placeholder" aria-label="VTU logo placeholder">VTU LOGO</div>
			<div class="portal-title-wrap">
				<p class="portal-subtitle">VTU Curriculum | CMRIT Physics Laboratory</p>
				<h1 class="portal-title">CIRCUITSPHERE</h1>
			</div>
			<div class="logo-placeholder" aria-label="CMRIT logo placeholder">CMRIT LOGO</div>
		</div>
		<nav class="portal-nav" aria-label="Primary navigation">
			<div class="container">
				<ul class="nav-links">
					<li><a href="/">Home</a></li>
					<li><a href="/experiments">Modules</a></li>
				</ul>
			</div>
		</nav>
	</header>

	<main class="main-content container">
		{% block content %}{% endblock %}
	</main>

	<footer class="site-footer">
		<div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;">
			<p style="display:flex;align-items:center;gap:0.5rem;margin:0;">
				<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10B981;box-shadow:0 0 6px #10B981;"></span>
				LABORATORY CONSOLE – ONLINE
			</p>
			<p style="margin:0;">Virtual Physics Lab | Engineering Physics Experiments</p>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<script>
		window.MathJax = {
			tex: {
				inlineMath: [['\\(', '\\)'], ['$', '$']],
				displayMath: [['\\[', '\\]'], ['$$', '$$']]
			},
			options: {
				skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
			}
		};
	</script>
	<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
	{% block scripts %}{% endblock %}
</body>
</html>
