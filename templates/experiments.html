{% extends "base.html" %}

{% block content %}
<section class="experiments-container">
    <h1>Virtual Physics Lab Experiments</h1>
    <p>Select an experiment to begin:</p>
    <ul class="experiment-list">
        {% for experiment in experiments %}
        <li>
            <a href="/experiments/{{ experiment }}">{{ experiment|title }} Circuit</a>
        </li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
